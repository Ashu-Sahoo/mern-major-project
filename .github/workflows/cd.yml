name: MERN Blog CD

on:
  workflow_run:
    workflows: ["MERN Blog CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  id-token: write

jobs:
  build-push-deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout the exact commit tested by CI
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Authenticate to Google Cloud using Workload Identity Federation
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Build and push backend image
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          IMAGE_TAG: ${{ github.event.workflow_run.head_sha }}
        run: |
          docker build -t "$DOCKERHUB_USERNAME/mern-blog-backend:$IMAGE_TAG" ./backend
          docker tag "$DOCKERHUB_USERNAME/mern-blog-backend:$IMAGE_TAG" "$DOCKERHUB_USERNAME/mern-blog-backend:latest"
          docker push "$DOCKERHUB_USERNAME/mern-blog-backend:$IMAGE_TAG"
          docker push "$DOCKERHUB_USERNAME/mern-blog-backend:latest"

      - name: Deploy backend to Cloud Run
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          IMAGE_TAG: ${{ github.event.workflow_run.head_sha }}
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          REGION: ${{ vars.GCP_REGION }}
          RUNTIME_SERVICE_ACCOUNT: ${{ secrets.GCP_RUNTIME_SERVICE_ACCOUNT }}
        run: |
          gcloud run deploy mern-blog-backend \
            --image="docker.io/$DOCKERHUB_USERNAME/mern-blog-backend:$IMAGE_TAG" \
            --project="$PROJECT_ID" \
            --region="$REGION" \
            --platform=managed \
            --allow-unauthenticated \
            --port=8080 \
            --service-account="$RUNTIME_SERVICE_ACCOUNT" \
            --set-env-vars="NODE_ENV=production,CORS_ORIGIN=*" \
            --set-secrets="MONGO_URI=mongo-uri:latest"

      - name: Get backend URL
        id: backend
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          REGION: ${{ vars.GCP_REGION }}
        run: |
          BACKEND_URL="$(gcloud run services describe mern-blog-backend --project="$PROJECT_ID" --region="$REGION" --format='value(status.url)')"
          echo "url=$BACKEND_URL" >> "$GITHUB_OUTPUT"
          echo "Backend deployed at $BACKEND_URL"

      - name: Build and push frontend image
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          IMAGE_TAG: ${{ github.event.workflow_run.head_sha }}
          BACKEND_URL: ${{ steps.backend.outputs.url }}
        run: |
          docker build \
            --build-arg VITE_API_URL="$BACKEND_URL/api" \
            -t "$DOCKERHUB_USERNAME/mern-blog-frontend:$IMAGE_TAG" \
            ./frontend
          docker tag "$DOCKERHUB_USERNAME/mern-blog-frontend:$IMAGE_TAG" "$DOCKERHUB_USERNAME/mern-blog-frontend:latest"
          docker push "$DOCKERHUB_USERNAME/mern-blog-frontend:$IMAGE_TAG"
          docker push "$DOCKERHUB_USERNAME/mern-blog-frontend:latest"

      - name: Deploy frontend to Cloud Run
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          IMAGE_TAG: ${{ github.event.workflow_run.head_sha }}
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          REGION: ${{ vars.GCP_REGION }}
        run: |
          gcloud run deploy mern-blog-frontend \
            --image="docker.io/$DOCKERHUB_USERNAME/mern-blog-frontend:$IMAGE_TAG" \
            --project="$PROJECT_ID" \
            --region="$REGION" \
            --platform=managed \
            --allow-unauthenticated \
            --port=8080

      - name: Show deployed frontend URL
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          REGION: ${{ vars.GCP_REGION }}
        run: |
          FRONTEND_URL="$(gcloud run services describe mern-blog-frontend --project="$PROJECT_ID" --region="$REGION" --format='value(status.url)')"
          echo "BlogSpace is deployed at: $FRONTEND_URL"
